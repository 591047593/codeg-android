# JVM args for the Gradle daemon. 2 GB heap is plenty for a single-module app.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.parallel=true
# Configuration cache is left off for now: Hilt's Gradle plugin + KSP can trip it
# on some versions. Enable once the build is stable.
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
# Cap the compile daemon. 2G was enough until 批v161/task-25 pushed
# TaskHubScreen.kt past 3.8k lines — compileLegacyReleaseKotlin then died with
# a Kotlin OutOfMemoryError inside IR lowering (Verify 红, 2026-11-06). 3G
# holds the whole module with headroom; four variant compiles in parallel
# still fit the runner (16G).
kotlin.daemon.jvmargs=-Xmx3g
